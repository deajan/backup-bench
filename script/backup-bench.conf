#!/usr/bin/env bash

CONF_VERSION=2026081804
#### backup-bench.sh configuration file

# This is where every data used by backup-bench will be stored (except SSH keys)
# Make sure you have enough disk space for the dataset and the backup repositories
BACKUP_BENCH_ROOT="/opt/backup_bench"

# Backup programs to benchmark, in the order they will be run.
# Each name here needs a set of install_/get_version_/init_/clear_/backup_/restore_
# functions in backup-bench.sh (see the "HOW BACKUP PROGRAMS ARE PLUGGED IN" header there)
BACKUP_SOFTWARES=(bupstash borg borg_beta kopia restic rustic duplicacy plakar)

LOG_DIR="${BACKUP_BENCH_ROOT}/logs/$(date +%Y-%m-%d_%H-%M-%S)"
LOG_FILE="${LOG_DIR}/${PROGRAM}.log"
CSV_RESULT_FILE="${LOG_DIR}/${PROGRAM}.results.csv"
BIN_DIR="${BACKUP_BENCH_ROOT}/bin"

#### SOURCE SETTINGS

# User on source system that will execute backup tools
SOURCE_USER=root
SOURCE_USER_HOMEDIR=$(eval echo ~${SOURCE_USER})

SOURCE_FQDN="source.example.tld" # FQDN of source server so target can upload ssh keys, password will be asked when --setup-remote-target is executed
SOURCE_SSH_PORT="22"

# git dataset (this dataset will be downloaded and used as primary test dataset)
GIT_DATASET_REPOSITORY="https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"
GIT_TAGS=(v5.19 v5.18 v4.18 v3.10)  # List of tags to backup
GIT_ROOT_DIRECTORY="linux"  # Name of the git repo directory

# Where source dataset is stored (when using git, includes git root directory)
# WARNING: when --git is used, this directory is deleted and re-cloned by --init-repos
BACKUP_ROOT="${BACKUP_BENCH_ROOT}/backup_test/linux"

# alternative (non-git) dataset, can be pointed to big files
# Without --git, backup-bench never writes into nor deletes this directory
#BACKUP_ROOT="${BACKUP_BENCH_ROOT}/data/backups"

# Directory where to restore data on source system, make sure you have enough disk space
RESTORE_DIR="${BACKUP_BENCH_ROOT}/tmp/backup-bench-restore"


#### TARGET SETTINGS

TARGET_ROOT="${BACKUP_BENCH_ROOT}/backup-bench-repos" # Root of target repositories, make sure you have enough disk space
HAVE_ZFS=false # Disable to ignore zfs setup
ZFS_POOL="backup" # ZFS pool (or parent dataset) in which one dataset per backup program is created when HAVE_ZFS is true

#### REMOTE TARGET SETTINGS

# Additional SSH tuning
SSH_OPTS="-o Compression=no -c chacha20-poly1305@openssh.com -x -T"

REMOTE_TARGET_FQDN="target.example.tld"  # FQDN of target server so source can upload data to
REMOTE_TARGET_SSH_PORT="22"

# This runner allows to connect from source to target as root in order to clear / repos
REMOTE_SSH_RUNNER="ssh -i ${SOURCE_USER_HOMEDIR}/.ssh/backup-bench.key -p ${REMOTE_TARGET_SSH_PORT} $SSH_OPTS -o StrictHostKeyChecking=accept-new root@${REMOTE_TARGET_FQDN}"

# BORG SPECIFIC SETTINGS
BORG_STABLE_REPO_LOCAL="${TARGET_ROOT}/borg/data"
BORG_BETA_REPO_LOCAL="${TARGET_ROOT}/borg_beta/data"
BORG_STABLE_REPO_REMOTE="borg_user@${REMOTE_TARGET_FQDN}:${TARGET_ROOT}/borg/data"
BORG_BETA_REPO_REMOTE="ssh://borg_beta_user@${REMOTE_TARGET_FQDN}${TARGET_ROOT}/borg_beta/data"
export BORG_PASSPHRASE=SOMEPASSWORD

# BUPSTASH SPECIFIC SETTINGS
BUPSTASH_REPOSITORY_LOCAL="${TARGET_ROOT}/bupstash/data"
BUPSTASH_REPOSITORY_COMMAND_REMOTE="ssh -i ${SOURCE_USER_HOMEDIR}/.ssh/bupstash.key -p ${REMOTE_TARGET_SSH_PORT} $SSH_OPTS -o StrictHostKeyChecking=accept-new -T bupstash_user@${REMOTE_TARGET_FQDN}"
export BUPSTASH_KEY="${SOURCE_USER_HOMEDIR}/bupstash.store.key"

# KOPIA SPECIFIC SETTINGS
KOPIA_USE_HTTP=false
KOPIA_HTTP_PORT=37890
export KOPIA_PASSWORD=SOMEPASSWORD
KOPIA_HTTP_USERNAME=backup-bench
KOPIA_HTTP_PASSWORD=SOMEHTTPPASSWORD
export KOPIA_SERVER_CONTROL_USER=masteruser                     # This allows to interact with kopia server (for server refresh)
export KOPIA_SERVER_CONTROL_PASSWORD=SOMEMASTERPASSWORD

# RESTIC SPECIFIC SETTINGS
export RESTIC_PASSWORD=SOMEPASSWORD
RESTIC_USE_HTTP=false
RESTIC_HTTP_PORT=37891

# RUSTIC SPECIFIC SETTINGS
export RUSTIC_PASSWORD=SOMEPASSWORD
RUSTIC_USE_HTTP=false
RUSTIC_HTTP_PORT=37892

# DUPLICACY SPECIFIC SETTINGS
export DUPLICACY_PASSWORD=SOMEPASSWORD
export DUPLICACY_SSH_KEY_FILE=${SOURCE_USER_HOMEDIR}/.ssh/duplicacy.key
# duplicacy stores its repository metadata in a '.duplicacy' directory inside the *current*
# directory. We run it from the directories below and point it at the dataset with
# 'init -repository', so it never writes into the data we benchmark (see issue #21)
DUPLICACY_PREF_DIR="${BACKUP_BENCH_ROOT}/duplicacy/backup"
DUPLICACY_RESTORE_PREF_DIR="${BACKUP_BENCH_ROOT}/duplicacy/restore"

# PLAKAR SPECIFIC SETTINGS
export PLAKAR_PASSPHRASE=SOMEPASSWORD
PLAKAR_REPOSITORY_LOCAL="${TARGET_ROOT}/plakar/data"
# plakar's sftp store shells out to the 'sftp' binary and takes no key or port options,
# so setup_source_plakar writes the matching stanza into the ssh client configuration
PLAKAR_REPOSITORY_REMOTE="sftp://plakar_user@${REMOTE_TARGET_FQDN}:${REMOTE_TARGET_SSH_PORT}${TARGET_ROOT}/plakar/data"
# plakar keeps S3 credentials in a named store instead of accepting them in a URL,
# so the s3 backend registers this store name with 'plakar store add' at init time
PLAKAR_S3_STORE_NAME="backup-bench-s3"

#### S3 BACKEND SETTINGS
# Used when running with --backend=s3.
# backup-bench does NOT install nor manage an S3 server: point the settings below at any
# S3 compatible endpoint you already run (MinIO, Garage, Ceph RGW, Wasabi, AWS, ...).
# Leaving S3_ENDPOINT empty disables the s3 backend.
S3_ENDPOINT=""                        # host[:port] without scheme, eg "target.example.tld:9000"
S3_USE_TLS=false                      # false talks plain HTTP to S3_ENDPOINT
S3_TLS_INSECURE=false                 # accept a self signed certificate when S3_USE_TLS is true
S3_REGION="us-east-1"                 # several programs require a region even when the server ignores it
# Keep credentials URL safe (no '/', ':' or '@'): borg and the mc client pass them inside URLs
S3_ACCESS_KEY="SOMEACCESSKEY"
S3_SECRET_KEY="SOMESECRETKEY"
# One bucket per program, named ${S3_BUCKET_PREFIX}<program name>. Bucket names cannot hold
# underscores, so borg_beta uses "borg-beta". Create them with --setup-s3-buckets
S3_BUCKET_PREFIX="backup-bench-"
# Set to true when your S3 server runs on REMOTE_TARGET_FQDN, so its page cache is dropped
# before every measure, like it is for the sftp backend
S3_DROP_TARGET_CACHES=false

#### TUNING PROFILES
# --profile decides how much each program gets tuned:
#   default    no compression nor concurrency option is passed at all, every program runs
#              exactly as it ships. This is what most people actually get
#   equalised  every program is pushed as close to the two targets below as its own
#              options allow, so programs can be compared at comparable settings
#   best       every program is asked for its strongest compression and as much
#              parallelism as it accepts. Comparable to that program's own default run,
#              not across programs
# Repositories MUST be cleared between two profiles: chunks are deduplicated on their
# plaintext, so a second profile would reuse the first one's chunks instead of
# recompressing them. The script refuses to benchmark a repository built by another profile
EQUALISED_ZSTD_LEVEL=3   # borg accepts zstd levels 1 to 22, and 3 is zstd's own default
EQUALISED_THREADS=8
BEST_ZSTD_LEVEL=19       # 19 is the highest standard zstd level, borg accepts up to 22
BEST_THREADS=0           # 0 means "one per processor" (nproc)

#### REPETITION
# How many times --repeat-benchmarks and --all run a full cycle for one backend and one
# profile. Every run clears and reinitializes the repositories first, because repeating a
# backup into a repository that already holds it would measure deduplication instead of
# the backup itself. The git dataset is downloaded once and reused by every run
RUNS=3
